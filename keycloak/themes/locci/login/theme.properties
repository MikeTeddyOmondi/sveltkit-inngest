# Locci login theme — matches the SvelteKit app's brand (paper/ink/accent + Syne/DM Mono).
# Inherits the modern keycloak.v2 theme (PatternFly v5) and layers one override stylesheet.
parent=keycloak.v2
import=common/keycloak

# Keep the parent's PatternFly common styles (inherited via stylesCommon), then
# load the parent's styles.css (resolved through theme inheritance) followed by
# our overrides. Order matters — locci.css must come last to win.
styles=css/styles.css css/locci.css
